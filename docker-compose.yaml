version: '3.8'

services: 
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - kafka_kraft:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  mongo:
    image: mongo
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval" ,"db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - mongo-db:/data/db
    

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  ingestion-service:
    build: 
      context: .
      dockerfile: ./ingestion-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      PODCASTS_DIR_PATH: /app/podcasts
      SEND_TOPC: podcasts-metadatas
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      kafka:
        condition: service_healthy

  processor-service:
    build: 
      context: .
      dockerfile: ./processor-service/Dockerfile
    ports:
      - "8010:8010"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      LISTEN_TOPIC: podcasts-metadatas
      GROUP_ID: processor-team
      DATABASE_NAME: podcasts
      ELASTIC_URI: http://elasticsearch:9200
      INDEX_NAME: podcasts-metadatas-index
      MONGO_URI: mongodb://mongo:27017

    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy   
      elasticsearch:
        condition: service_healthy
        
volumes:
  esdata:
  kafka_kraft:
  mongo-db: